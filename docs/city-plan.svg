<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 840" font-family="system-ui, -apple-system, sans-serif">
  <!-- Los Soles city plan (Phase 2). 1 px = 4 m; the city is 3,072 m square; x east, z (down) south.
       Map origin (0, 0) is the current downtown spawn plaza at pixel (384, 384). -->
  <rect width="768" height="840" fill="#0b0d12"/>
  <g transform="translate(0,0)">
    <!-- land -->
    <rect x="0" y="0" width="768" height="768" fill="#d9d2c3"/>
    <!-- ocean: west coast and the south-west bay -->
    <path d="M0,0 L60,0 C70,120 52,230 66,330 C80,430 60,520 78,600 C110,660 160,690 230,700 C300,708 330,740 360,768 L0,768 Z" fill="#7fb3d5"/>
    <!-- harbour basin in the south-east -->
    <path d="M560,768 L560,700 L610,690 L640,712 L700,700 L768,690 L768,768 Z" fill="#7fb3d5"/>
    <!-- districts -->
    <g stroke="#0b0d12" stroke-opacity="0.25" stroke-width="1">
      <path d="M60,0 L768,0 L768,140 L640,150 L520,170 L380,165 L220,175 L120,190 L66,200 C60,120 70,60 60,0 Z" fill="#a9b98f"/>
      <rect x="640" y="0" width="128" height="140" fill="#b9ad97"/>
      <path d="M66,200 L150,190 L150,560 L78,600 C60,520 80,430 66,330 Z" fill="#f0d9a8"/>
      <rect x="150" y="200" width="150" height="190" fill="#c7d9a8"/>
      <rect x="300" y="250" width="210" height="160" fill="#b7bcc9"/>
      <rect x="440" y="170" width="80" height="70" fill="#d6c1d9"/>
      <rect x="150" y="390" width="150" height="170" fill="#e4cfb9"/>
      <rect x="300" y="410" width="210" height="150" fill="#cdb8a3"/>
      <path d="M150,560 L520,560 L520,690 L360,768 C330,740 300,708 230,700 C160,690 110,660 78,600 Z" fill="#e2c7b0"/>
      <rect x="560" y="170" width="208" height="230" fill="#d3c4b0"/>
      <rect x="590" y="300" width="100" height="90" fill="#cfe0e8"/>
      <rect x="560" y="400" width="208" height="290" fill="#bdb5a6"/>
    </g>
    <!-- concrete river channel, north to the harbour -->
    <path d="M540,0 C545,100 535,180 538,260 C541,380 548,520 552,620 L556,700" fill="none" stroke="#9aa3ad" stroke-width="10"/>
    <path d="M540,0 C545,100 535,180 538,260 C541,380 548,520 552,620 L556,700" fill="none" stroke="#c8d4dc" stroke-width="4"/>
    <!-- Coast Road along the beach -->
    <path d="M92,30 C100,150 85,260 98,360 C110,460 95,540 110,600" fill="none" stroke="#f7f3ea" stroke-width="5"/>
    <!-- the Boulevard: east-west across the north of the flats -->
    <line x1="120" y1="232" x2="540" y2="232" stroke="#ff9f43" stroke-width="5"/>
    <!-- arterial grid (every ~480 m) -->
    <g stroke="#f7f3ea" stroke-width="3">
      <line x1="150" y1="190" x2="150" y2="680"/><line x1="270" y1="175" x2="270" y2="700"/>
      <line x1="384" y1="165" x2="384" y2="740"/><line x1="504" y1="168" x2="504" y2="690"/>
      <line x1="640" y1="150" x2="640" y2="690"/><line x1="66" y1="330" x2="768" y2="330"/>
      <line x1="80" y1="450" x2="768" y2="450"/><line x1="100" y1="570" x2="768" y2="570"/>
    </g>
    <!-- freeways -->
    <g stroke="#5b6b7a" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="80" y1="437" x2="768" y2="437"/>
      <line x1="524" y1="0" x2="524" y2="700"/>
      <path d="M300,165 C380,150 460,150 524,170"/>
    </g>
    <g stroke="#f2c14e" stroke-width="2" stroke-dasharray="6 5" fill="none">
      <line x1="80" y1="437" x2="768" y2="437"/>
      <line x1="524" y1="0" x2="524" y2="700"/>
    </g>
    <circle cx="524" cy="437" r="14" fill="none" stroke="#e85d75" stroke-width="3"/>
    <!-- prototype area (already built) -->
    <rect x="319" y="319" width="130" height="124" fill="none" stroke="#7def06" stroke-width="2.5" stroke-dasharray="5 3"/>
    <!-- landmarks -->
    <g fill="#0b0d12" font-size="9" font-weight="700">
      <path d="M180,58 l6,-10 l6,10 z" fill="#e85d75"/><text x="196" y="57">The sign</text>
      <circle cx="330" cy="80" r="5" fill="#e85d75"/><text x="339" y="83">Observatory</text>
      <circle cx="478" cy="205" r="5" fill="#e85d75"/><text x="420" y="200">Stadium</text>
      <rect x="22" y="385" width="46" height="5" fill="#8b5e3c"/><circle cx="30" cy="379" r="7" fill="none" stroke="#e85d75" stroke-width="2"/><text x="6" y="402">Pier + wheel</text>
      <rect x="402" y="300" width="9" height="9" fill="#e85d75"/><text x="414" y="308">City hall</text>
      <circle cx="640" cy="345" r="5" fill="#e85d75"/>
    </g>
    <!-- district labels -->
    <g fill="#0b0d12" font-size="12" font-weight="800" text-anchor="middle">
      <text x="380" y="118">THE HILLS</text>
      <text x="704" y="72" font-size="10">QUARRY</text>
      <text x="108" y="290" font-size="10" transform="rotate(-80 108 290)">BEACH CITY</text>
      <text x="225" y="300">PALM</text><text x="225" y="314">HEIGHTS</text>
      <text x="405" y="282">DOWNTOWN</text>
      <text x="480" y="213" font-size="8">STADIUM HILL</text>
      <text x="225" y="480" font-size="11">MID-CITY</text>
      <text x="405" y="505" font-size="11">ARTS DISTRICT</text>
      <text x="320" y="635">SOUTH GRID</text>
      <text x="664" y="235" font-size="11">EASTSIDE</text>
      <text x="640" y="376" font-size="8">MEDICAL</text>
      <text x="664" y="560" font-size="11">PORT &amp;</text><text x="664" y="574" font-size="11">INDUSTRIAL</text>
      <text x="40" y="700" fill="#ffffff" font-size="11">PACIFIC</text>
    </g>
    <g fill="#0b0d12" font-size="8" font-weight="700">
      <text x="200" y="228">THE BOULEVARD</text>
      <text x="690" y="432">SOL FREEWAY</text>
      <text x="528" y="20" transform="rotate(90 528 20)">VALLEY FREEWAY</text>
      <text x="546" y="640" fill="#4c5a66" transform="rotate(88 546 640)">RIVER</text>
    </g>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#e9ecef">
    <rect x="16" y="782" width="14" height="6" fill="#5b6b7a"/><text x="36" y="789">Freeway</text>
    <rect x="110" y="782" width="14" height="6" fill="#ff9f43"/><text x="130" y="789">The Boulevard</text>
    <rect x="236" y="782" width="14" height="6" fill="#f7f3ea"/><text x="256" y="789">Arterial roads</text>
    <circle cx="372" cy="785" r="6" fill="none" stroke="#e85d75" stroke-width="2"/><text x="384" y="789">Four-level interchange</text>
    <rect x="534" y="780" width="16" height="10" fill="none" stroke="#7def06" stroke-width="2" stroke-dasharray="4 2"/><text x="556" y="789">Built so far</text>
    <text x="16" y="818" fill="#9aa3ad">Los Soles · 3.1 × 3.1 km · 1 square = 1 px = 4 m · original names, LA-inspired</text>
    <line x1="560" y1="814" x2="685" y2="814" stroke="#e9ecef" stroke-width="2"/><text x="690" y="818">500 m</text>
  </g>
</svg>
